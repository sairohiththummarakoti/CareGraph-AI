[project]
name = "caregraph-ai"
version = "0.1.0"
description = "Local synthetic educational RAG with LangGraph and FAISS"
requires-python = ">=3.11,<3.13"
dependencies = [
  "langgraph>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-text-splitters>=1.0,<2",
  "sentence-transformers>=3.4,<4",
  "transformers>=4.48,<4.50",
  "torch>=2.6,<2.7",
  "faiss-cpu>=1.10,<2",
  "pypdf>=5,<7",
  "python-dotenv>=1,<2",
  "langsmith>=0.4,<1",
  "rich>=13,<15",
  "streamlit>=1.44,<2",
  "pytest>=8,<10",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
